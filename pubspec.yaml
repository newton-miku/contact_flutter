name: contact_flutter
description: 现代式通讯录应用，支持打电话、发短信、导出联系人到系统通讯录。
publish_to: 'none'
# 开发期占位版本，【不需要为发版而修改】，也【不允许】出现在任何对外产物里。
#
# 正式发布完全由 tag 驱动：推一个 v1.0.0 的 tag，CI 会
#   - 从 tag 取版本名
#   - 用 MAJOR×10000 + MINOR×100 + PATCH 换算出 versionCode
#   - 通过 --build-name / --build-number 覆盖本次构建
#     （Android / Windows / Linux 三个平台都注入，见 .github/workflows/build.yml；
#      桌面端的版本号分别来自 exe 的 VERSIONINFO 与 flutter_assets/version.json，
#      不注入就会固定成这里的值，用户装了新版仍被提示"发现新版本"）
#
# 换算的唯一实现是 tool/derive_version.sh，发布脚本与各构建脚本都调它。
#
# 这里刻意写成 0.0.0：它一眼就能看出不是正式版本。本地发布脚本
# （release_gitcode.py / build_deb.sh）在没有显式版本号时会直接报错，
# 不会再悄悄回退到这个值——免得把 0.0.0 当成真版本发出去。
version: 0.0.0

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1

  # Network & 本地缓存
  http: ^1.2.2
  shared_preferences: ^2.3.3

  # System APIs (打电话、发短信、打开设置)
  url_launcher: ^6.3.1
  permission_handler: ^11.3.1

  # 生物认证
  local_auth: ^2.3.0

  # Utilities
  collection: ^1.19.0
  intl: ^0.20.2
  pinyin: ^3.3.0
  crypto: ^3.0.7
  package_info_plus: ^10.2.1
  mobile_scanner: ^7.4.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
