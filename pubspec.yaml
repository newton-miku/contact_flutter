name: contact_flutter
description: 现代式通讯录应用，支持打电话、发短信、导出联系人到系统通讯录。
publish_to: 'none'

# ⚠️⚠️ 这是 linux-uos 分支，与 main 的用途不同 ⚠️⚠️
#
# 本分支专为【UOS Desktop 20 Professional / Debian 10 底子 / glibc 2.28】维护，
# 只用来打 Linux 的 .deb。原因：
#   Flutter 的 Linux 桌面引擎是预编译产物，它自己链的 glibc 决定了产物能跑在哪。
#   Flutter 3.10.x 之后引擎要求 glibc ≥ 2.31，而 UOS 20 只有 2.28 → 直接跑不起来。
#   所以这条线【只能用 Flutter 3.10.x】（自带 Dart 3.0.6）。
#
# 由此带来的连锁约束：Dart 从 3.0 到 3.12 跨了一整个大版本，
# main 上钉的依赖（cupertino_icons/intl/shared_preferences 等）
# 普遍要求 Dart ≥3.9，在 3.0.6 上根本解不出来，
# 所以本分支的依赖整体锚定在 2023 年中的版本——【不要照抄 main 的 pubspec】。
#
# 维护方式：main 继续跑现代 Flutter（Android / Windows / CI），
# 这边只挑需要的修复 cherry-pick 过来，两边不合并。
#
# 版本号：同 main，由 tag 注入，pubspec 里的 0.0.0 只是开发期占位。
version: 0.0.0

environment:
  # Dart 3.0.6 是 Flutter 3.10.6 自带的版本
  sdk: ">=3.0.0 <4.0.0"
  # 刻意把 Flutter 也钉住：用更新的 SDK 会在 pub get 阶段就被拦下，
  # 免得编出一个"能构建但装到 UOS 上跑不起来"的包。
  flutter: ">=3.10.0 <3.11.0"

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.2

  # State management
  flutter_riverpod: ^2.4.0

  # Network & 本地缓存
  http: ^1.1.0
  shared_preferences: ^2.2.0

  # System APIs (打电话、发短信、打开设置)
  url_launcher: ^6.1.0
  permission_handler: ^10.4.0

  # 生物认证
  local_auth: ^2.1.0

  # Utilities
  collection: ^1.17.0
  # intl 必须留在 0.18.x：Flutter 3.10 的 flutter_localizations 锁的就是它
  intl: ^0.18.0
  pinyin: ^3.2.0
  crypto: ^3.0.3
  package_info_plus: ^4.2.0
  mobile_scanner: ^3.2.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true

  # ARM64 Linux 的官方 Flutter 引擎（< 3.50.0）没有链接 Fontconfig，引擎取不到任何系统
  # 字体，所有文字都画成方框。资产字体走 Skia 直接加载，不经 Fontconfig，所以必须自带一份
  # 中文字体。详见 BUILD-linux-uos.md。
  fonts:
    - family: ContactCJK
      fonts:
        - asset: assets/fonts/NotoSansSC-Regular.otf
