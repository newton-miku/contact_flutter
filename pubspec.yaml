name: contact_flutter
description: 现代式通讯录应用，支持打电话、发短信、导出联系人到系统通讯录。
publish_to: 'none'
# 产品版本(versionName) + versionCode。
# versionCode = MAJOR×10000 + MINOR×100 + PATCH（只增不回退；1.0.0 → 10000）。
version: 1.0.0+10000

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1

  # Network & 本地缓存
  http: ^1.2.2
  shared_preferences: ^2.3.3

  # System APIs (打电话、发短信、打开设置)
  url_launcher: ^6.3.1
  permission_handler: ^11.3.1

  # 生物认证
  local_auth: ^2.3.0

  # Utilities
  collection: ^1.19.0
  intl: ^0.20.2
  pinyin: ^3.3.0
  crypto: ^3.0.7
  package_info_plus: ^10.2.1
  mobile_scanner: ^7.4.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
