# 正式版本发布：推一个 tag 即可，自动构建全部平台产物并发布到 GitCode 公开仓
#
# ─────────────────────────────────────────────────────────────────────────────
# 发布方式：只要打 tag 并推送，例如
#     git tag v1.0.0 && git push origin v1.0.0
# 然后由本工作流完成其余全部工作。**不需要修改 pubspec.yaml**，也不必手工
# 维护 versionCode —— 两者都由 tag 推导（换算的唯一实现在 tool/derive_version.sh）：
#
#     tag          v1.0.0
#     versionName  1.0.0                       （取自 tag）
#     versionCode  10000 = 1×10000 + 0×100 + 0
#                  规则：MAJOR×10000 + MINOR×100 + PATCH
#                  MINOR/PATCH 各占两位，需 < 100，否则会进位串位。
#
#   版本通过 flutter 的 --build-name / --build-number 注入本次构建，
#   pubspec 里的 version 只是开发期占位值。
#   **桌面端也必须在构建时注入**：Windows 的版本号来自 exe 的 VERSIONINFO、
#   Linux 的来自 flutter_assets/version.json，不注入就会永远停在 pubspec 的占位值，
#   用户装了新版仍被提示"发现新版本"。
#
# ─────────────────────────────────────────────────────────────────────────────
# 产出三个产物，命名与 GitHub Release 上完全一致（App 端按这套约定挑包）：
#     contact_flutter_<tag>.apk              默认包：arm + arm64
#     contact_flutter_<tag>_x86_64.apk       x86_64，模拟器用
#     contact_flutter_windows_x64_<tag>.zip  Windows 免安装包
#   Linux 暂无产物（.deb 走 tool/build_deb.sh 本地打包）。
#   附件名不能含 '+'：GitCode 侧会拒绝（'+' 在 URL 里代表空格，下载会 404）。
#
# ─────────────────────────────────────────────────────────────────────────────
# 更新说明（不写也能发版）
#   1) 若 CHANGELOG.md 里有 "## [1.0.0]" 段落 → 用它
#   2) 否则用 tool/gen_release_notes.sh 按提交记录自动生成中文说明
#
# 为什么发布到 GitCode 而不是 GitHub
#   更新分发必须【公开可读】，而本仓库是私有的（含服务器地址等信息）。
#   于是拆成"公私两仓"：
#     私有 GitHub 仓（本仓）：开发主干，CI 构建与测试
#     公开 GitCode 仓 <GITCODE_OWNER>/<GITCODE_REPO>：版本历史 + Release 附件
#   App 端"自动检查更新"读的是 GitCode 的【免鉴权】接口，已实测匿名可读、可下载。
#
#   两端坐标同源：App 里的更新源不是写死的，打包时由下面两个变量经 --dart-define
#   注入（见 lib/config/app_config.dart）。换公开仓只改变量，代码与 pubspec 都不用动。
#
# ── 配置放哪里：Environment 与 Repository 两种都支持 ──
#   本工作流用 ${{ vars.* }} / ${{ secrets.* }} 取值，GitHub 的解析规则是
#   「Environment 作用域优先，找不到再落到 Repository 作用域」，因此同一份 YAML
#   既能用 Repository 级配置，也能用 Environment 级配置，无需维护两套。
#
#   变量（Settings → Secrets and variables → Actions → Variables）
#     GITCODE_OWNER            公开仓所属用户名/组织（必填；同时注入 App 的更新源）
#     GITCODE_REPO             公开仓仓库名（必填；同时注入 App 的更新源）
#     RELEASE_ENVIRONMENT      可选，指定用哪个 Environment，未设则用 release
#
#   密钥（同页面的 Secrets）
#     GITCODE_TOKEN            GitCode 访问令牌（勾选仓库读写）
#     API_BASE_URL             后端地址
#     SIGNING_BUNDLE_BASE64    发布签名包（与 build.yml 共用）
#
#   想限定作用域就建 Environment，**环境名跟着 ref 自动选**（见下面的选定规则），
#   把变量/密钥放进对应的 Environment；不建 Environment 也能跑，此时全部取 Repository 级。
#   注意：三个作业都声明了 environment，这样 Environment 级的密钥在构建阶段
#   也能取到（只声明在发布作业上的话，构建作业会拿到空值）。
#
#   ── 环境名的选定规则（唯一实现在 resolve_env 作业里）──
#     1) 手动触发时填了 environment 输入      → 用它
#     2) 分支推送 / 从分支手动触发              → 用分支名（dev → dev，main → main）
#     3) tag 推送                              → 用默认分支名（通常 main）
#   ⚠️ tag 推送时 github.ref_name 是【tag 名】而不是分支名。直接拿它当环境名会去找
#      一个叫 v1.0.1 的环境，而 Actions 会【自动建一个空的】——环境级配置全部读不到，
#      工作流却仍是绿的。所以 tag 只能用默认分支名；想发 dev 的包就从 dev 分支手动触发。
#   ⚠️ 环境不存在时同样会被自动建成空的。用到哪些分支，就要先建好哪些 Environment。
##   校验步骤会把取值结果写进 Step Summary，一眼能看出是"没配"还是"找错地方了"。
# ─────────────────────────────────────────────────────────────────────────────
name: 发布正式版到 GitCode

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的版本 tag（如 v1.0.1；留空则用当前 ref）'
        required: true
      environment:
        description: 'Environment 名。留空则自动选：分支触发用分支名，tag 推送用默认分支名'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  # ---------- 0) 先决定这次用哪个 Environment ----------
  #
  # 为什么要单开一个作业：jobs.<job_id>.environment 只能用
  #   github / needs / strategy / matrix / vars / inputs
  # 这几个上下文（见 Contexts 参考），**不能用 env、也不能用某一步 steps 的输出**。
  # 所以"按分支自动选环境"这条规则没法在工作流里定义成常量，
  # 只能算出来交出去 —— needs.*.outputs 恰好是允许的，这里就靠它。
  #
  # 顺带把"依据"打出来：环境取错时最难判断的就是"它到底按什么挑的"。
  resolve_env:
    name: 选定 Environment
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.pick.outputs.name }}
    steps:
      - id: pick
        env:
          INPUT_ENV: ${{ github.event.inputs.environment }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # 全部用 ${X:-} 取值：缺某个变量时应当走回退，
          # 而不是在 set -u 下抛一句 unbound variable 让人猜。
          if [ -n "${INPUT_ENV:-}" ]; then
            NAME="${INPUT_ENV}"
            WHY="手动指定的 environment 输入"
          elif [ "${REF_TYPE:-}" = "tag" ]; then
            # ⚠️ tag 推送时 github.ref_name 是【tag 名】而不是分支名。
            #    直接拿它当环境名会去找一个叫 v1.0.1 的环境，而 Actions 会
            #    【自动建一个空的】—— 环境级配置全部读不到，工作流却仍是绿的。
            #    所以 tag 只能用默认分支名。想发 dev 的包就从 dev 分支手动触发，
            #    那时 ref_name 就是 dev。
            NAME="${DEFAULT_BRANCH:-main}"
            WHY="tag 推送，用默认分支名"
          else
            NAME="${REF_NAME:?分支触发时必须能取到分支名}"
            WHY="分支名（dev 分支用 dev 的 Environment，以此类推）"
          fi
          echo "选定 Environment：$NAME"
          echo "依据：$WHY"
          # 环境不存在时 GitHub 会【自动建一个空的】，这里提醒一句
          echo "（若该 Environment 不存在，Actions 会自动建一个空的，环境级配置将全部读不到）"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

  # ---------- 1) Android：默认包（arm+arm64）与 x86_64 包 ----------
  # 两次构建是必须的：abiFilters 由 flutter 传入的 -Ptarget-platform 决定，
  # 一次构建只能出一种 ABI 组合（详见 android/app/build.gradle.kts）。
  build-android:
    name: 构建 APK
    needs: [resolve_env]
    runs-on: ubuntu-latest
    environment: ${{ needs.resolve_env.outputs.name }}
    env:
      GITCODE_ENV_NAME: ${{ needs.resolve_env.outputs.name }}
      API_BASE_URL: ${{ secrets.API_BASE_URL }}
      SIGNING_BUNDLE_BASE64: ${{ secrets.SIGNING_BUNDLE_BASE64 }}
      # 发布目标仓库坐标也注入 App 的更新源：装出来的包自己就知道去哪里检查更新。
      # 变量没配时是空串，App 端按"未配置"回退内置默认值（见 app_config.dart 的 _or）。
      # owner/repo 不敏感，Variables / Secrets 两个位置都认（放错页也能跑）。
      GITCODE_OWNER: ${{ vars.GITCODE_OWNER || secrets.GITCODE_OWNER }}
      GITCODE_REPO: ${{ vars.GITCODE_REPO || secrets.GITCODE_REPO }}
    steps:
      # 取【要发布的那个 tag】的代码，而不是当前分支的 HEAD：
      # 手动触发（workflow_dispatch）时 github.ref 指向分支，只用默认 checkout
      # 会拿 main 的代码去构建、却打上输入 tag 的版本号——产物与标签对不上。
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: 校验构建所需密钥
        run: |
          set -euo pipefail
          missing=""
          [ -n "${API_BASE_URL:-}" ] || missing="${missing}"$'\n'"  - 密钥 API_BASE_URL（后端地址）"
          [ -n "${SIGNING_BUNDLE_BASE64:-}" ] || missing="${missing}"$'\n'"  - 密钥 SIGNING_BUNDLE_BASE64（发布签名包）"
          if [ -n "${missing}" ]; then
            echo "::error::缺少以下配置：${missing}"
            echo "在 Settings → Secrets and variables → Actions 里添加；"
            echo "也可放进 Environment（名为 ${GITCODE_ENV_NAME}）以限定作用域。"
            exit 1
          fi
          echo "配置检查通过（Environment：${GITCODE_ENV_NAME}）"

      # 版本号的唯一换算入口；三个作业都调用同一个脚本，避免公式抄成三份
      - name: 由 tag 推导版本号
        env:
          REQ_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: bash tool/derive_version.sh "$REQ_TAG" --github-env >> "$GITHUB_ENV"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true

      - name: 恢复发布签名
        run: |
          set -euo pipefail
          echo "$SIGNING_BUNDLE_BASE64" | base64 -d | tar -xzf - -C android
          ls -l android/release.jks android/key.properties

      - run: flutter pub get

      # NDK / CMake 是 AGP 配置原生依赖时必须的，而 runner 上默认没装、许可也没接受，
      # 缺了这两步会在 Gradle【配置阶段】就失败（不是编译失败，日志容易看漏）：
      #   com.android.builder.sdk.LicenceNotAcceptedException: ndk;30.0.15729638
      # 与 build.yml 同一套做法，共用同一个缓存键。
      - name: 缓存 NDK / CMake
        uses: actions/cache@v6
        with:
          path: |
            ${{ env.ANDROID_SDK_ROOT }}/ndk
            ${{ env.ANDROID_SDK_ROOT }}/cmake
          key: ndk-30.0.15729638-cmake-3.22.1-${{ runner.os }}
      - name: 接受 Android SDK 许可并安装 NDK/CMake（已缓存则跳过）
        run: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          if [[ -d "$SDK/ndk/30.0.15729638" && -d "$SDK/cmake/3.22.1" ]]; then
            echo "NDK/CMake 已命中缓存，跳过 sdkmanager"
          else
            yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
            "$SDK/cmdline-tools/latest/bin/sdkmanager" "ndk;30.0.15729638" "cmake;3.22.1" > /dev/null || true
          fi

      - name: 构建默认包（arm + arm64）
        run: |
          set -euo pipefail
          mkdir -p dist
          flutter build apk --release --no-pub \
            --build-name="$APP_VER" \
            --build-number="$APP_CODE" \
            --target-platform android-arm,android-arm64 \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --dart-define=APP_VERSION="$(git rev-parse --short HEAD)" \
            --dart-define=BUILD_TIME="$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            --dart-define=UPDATE_REPO_OWNER="$GITCODE_OWNER" \
            --dart-define=UPDATE_REPO_NAME="$GITCODE_REPO"
          # 第二次构建会覆盖 app-release.apk，所以每次都立刻改名搬走
          cp build/app/outputs/flutter-apk/app-release.apk "dist/contact_flutter_${TAG}.apk"

      - name: 构建 x86_64 包（模拟器用）
        run: |
          set -euo pipefail
          flutter build apk --release --no-pub \
            --build-name="$APP_VER" \
            --build-number="$APP_CODE" \
            --target-platform android-x64 \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --dart-define=APP_VERSION="$(git rev-parse --short HEAD)" \
            --dart-define=BUILD_TIME="$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            --dart-define=UPDATE_REPO_OWNER="$GITCODE_OWNER" \
            --dart-define=UPDATE_REPO_NAME="$GITCODE_REPO"
          cp build/app/outputs/flutter-apk/app-release.apk "dist/contact_flutter_${TAG}_x86_64.apk"

      # 校验"真正要上传的那两个包"里的版本号：Flutter 的构建缓存可能留着旧版本，
      # 版本号错了用户端会一直误判，且极难排查。
      - name: 校验两个包内的版本号与 ABI
        run: |
          set -euo pipefail
          python3 tool/release_gitcode.py --version "$APP_VER" --verify-only \
            --apk "dist/contact_flutter_${TAG}.apk" \
            --apk "dist/contact_flutter_${TAG}_x86_64.apk"
          BT=$(ls -d "${ANDROID_SDK_ROOT:-$ANDROID_HOME}"/build-tools/* | sort -V | tail -1)
          abis_of() { unzip -l "$1" | grep -o 'lib/[^/]*' | sed 's|lib/||' | sort -u | paste -sd, - || true; }
          ARM=$(abis_of "dist/contact_flutter_${TAG}.apk")
          X86=$(abis_of "dist/contact_flutter_${TAG}_x86_64.apk")
          for need in arm64-v8a armeabi-v7a; do
            [[ "$ARM" == *"$need"* ]] || { echo "::error::默认包缺少 $need（当前: ${ARM:-空}）"; exit 1; }
          done
          [[ "$ARM" != *"x86_64"* ]] || { echo "::error::默认包不应含 x86_64（当前: $ARM）"; exit 1; }
          [[ "$X86" == "x86_64" ]] || { echo "::error::x86_64 包内容不对（当前: ${X86:-空}）"; exit 1; }
          echo "默认包 ABI：$ARM"
          echo "x86_64 包 ABI：$X86"

      - uses: actions/upload-artifact@v7
        with:
          name: android-apks
          path: dist/
          if-no-files-found: error

  # ---------- 2) Windows：免安装 zip 的内容 ----------
  # 只产出构建目录，zip 由发布作业在 ubuntu 上用 Info-ZIP 打：
  # 这样能保证压缩包内是标准的 '/' 分隔条目（PowerShell 的 Compress-Archive
  # 在 5.1 上会写成 '\'，属于不合规的 zip）。
  build-windows:
    name: 构建 Windows 包
    needs: [resolve_env]
    runs-on: windows-latest
    environment: ${{ needs.resolve_env.outputs.name }}
    env:
      GITCODE_ENV_NAME: ${{ needs.resolve_env.outputs.name }}
      API_BASE_URL: ${{ secrets.API_BASE_URL }}
      GITCODE_OWNER: ${{ vars.GITCODE_OWNER || secrets.GITCODE_OWNER }}
      GITCODE_REPO: ${{ vars.GITCODE_REPO || secrets.GITCODE_REPO }}
    steps:
      # 同 Android 作业：按输入 tag 取代码
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: 校验构建所需密钥
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${API_BASE_URL:-}" ]; then
            echo "::error::缺少密钥 API_BASE_URL（后端地址，打包时注入）"
            echo "在 Settings → Secrets and variables → Actions 里添加；"
            echo "也可放进 Environment（名为 ${GITCODE_ENV_NAME}）以限定作用域。"
            exit 1
          fi
          echo "配置检查通过（Environment：${GITCODE_ENV_NAME}）"

      - name: 由 tag 推导版本号
        shell: bash
        env:
          REQ_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: bash tool/derive_version.sh "$REQ_TAG" --github-env >> "$GITHUB_ENV"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true

      # 桌面端也必须注入版本号：Windows 的版本来自 exe 的 VERSIONINFO，
      # 不注入就固定是 pubspec 的占位值，App 永远认为自己该更新。
      - name: 构建 Windows release
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          flutter build windows --release --no-pub \
            --build-name="$APP_VER" \
            --build-number="$APP_CODE" \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --dart-define=APP_VERSION="$(git rev-parse --short HEAD)" \
            --dart-define=BUILD_TIME="$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            --dart-define=UPDATE_REPO_OWNER="$GITCODE_OWNER" \
            --dart-define=UPDATE_REPO_NAME="$GITCODE_REPO"

      - name: 确认产物里的版本号已注入
        shell: pwsh
        run: |
          $exe = "build\windows\x64\runner\Release\contact_flutter.exe"
          if (-not (Test-Path $exe)) { Write-Error "::error::未找到 $exe"; exit 1 }
          $v = (Get-Item $exe).VersionInfo.ProductVersion
          Write-Host "exe ProductVersion = $v"
          if ($v -notlike "$env:APP_VER*") {
            Write-Error "::error::exe 版本号（$v）与 tag 推导值（$env:APP_VER）不符，桌面端更新检查会误判"
            exit 1
          }

      - uses: actions/upload-artifact@v7
        with:
          name: windows-release
          path: build/windows/x64/runner/Release/
          if-no-files-found: error

  # ---------- 3) 发布到 GitCode ----------
  publish:
    name: 发布 Release 到 GitCode
    needs: [resolve_env, build-android, build-windows]
    runs-on: ubuntu-latest
    environment: ${{ needs.resolve_env.outputs.name }}
    env:
      GITCODE_ENV_NAME: ${{ needs.resolve_env.outputs.name }}
      # ── 密钥（Environment secret 优先，其次 Repository secret）──
      GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
      API_BASE_URL: ${{ secrets.API_BASE_URL }}
      # ── 变量（Environment variable 优先，其次 Repository variable）──
      # 发布目标仓库坐标：脚本与 action 都从这里取，脚本里不写死 owner/repo。
      # owner/repo 不是敏感信息，两个位置都认——放错页是很容易犯的错，
      # 而 GitHub 只会给空值，报错完全指不到真正的原因。
      # token 刻意【不】从 variables 读：变量不脱敏，会把它泄漏进日志。
      GITCODE_OWNER: ${{ vars.GITCODE_OWNER || secrets.GITCODE_OWNER }}
      GITCODE_REPO: ${{ vars.GITCODE_REPO || secrets.GITCODE_REPO }}
    steps:
      # 完整历史：gen_release_notes.sh 要找上一个 tag 并跨 tag 比对提交；
      # 推 tag 到公开仓也需要 tag 对象本身。
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - name: 校验配置（变量与密钥）
        run: |
          set -euo pipefail
          # 先把"取了哪些、是空还是不空"写进摘要：GitHub 对 vars/secrets 的解析是
          # 「Environment 优先，回退 Repository」，取不到时只给空值、不告诉你它去哪找过，
          # 于是同一种症状可能是四种完全不同的原因。
          mark() { [ -n "${1:-}" ] && echo "已取到" || echo "**空**"; }
          {
            echo "### 配置解析情况"
            echo ""
            echo "本次生效的 Environment：\`${GITCODE_ENV_NAME}\`"
            echo ""
            echo "| 名称 | 期望位置 | 结果 |"
            echo "| --- | --- | --- |"
            echo "| GITCODE_OWNER | Variables 或 Secrets | $(mark "${GITCODE_OWNER:-}") |"
            echo "| GITCODE_REPO | Variables 或 Secrets | $(mark "${GITCODE_REPO:-}") |"
            echo "| GITCODE_TOKEN | 仅 Secrets | $(mark "${GITCODE_TOKEN:-}") |"
            echo "| API_BASE_URL | 仅 Secrets | $(mark "${API_BASE_URL:-}") |"
          } >> "$GITHUB_STEP_SUMMARY"

          missing=""
          # 注意用 $'\n' 拼接换行（普通字符串里的 \n 只会输出字面量）
          [ -n "${GITCODE_OWNER:-}" ] || missing="${missing}"$'\n'"  - GITCODE_OWNER（公开仓所属用户名/组织）"
          [ -n "${GITCODE_REPO:-}" ]  || missing="${missing}"$'\n'"  - GITCODE_REPO（公开仓仓库名）"
          [ -n "${GITCODE_TOKEN:-}" ] || missing="${missing}"$'\n'"  - GITCODE_TOKEN（GitCode 访问令牌，需仓库读写权限）"
          [ -n "${API_BASE_URL:-}" ]  || missing="${missing}"$'\n'"  - API_BASE_URL（后端地址，打包时注入）"
          if [ -n "${missing}" ]; then
            echo "::error::缺少以下配置：${missing}"
            cat <<'CONFIG_HELP'
          GitHub 的取值顺序是【Environment 作用域优先，找不到再回退 Repository 作用域】。
          本次作业声明的 Environment 就是上面摘要里那个名字，请依次确认：

            1) 这个 Environment 在本仓库（GitHub 上的私有仓）里确实存在。
               不存在时 Actions 会自动建一个【空的】，于是什么都取不到。
            2) 变量放 Variables 页、密钥放 Secrets 页，名字大小写要完全一致。
               token 只能放 Secrets：Variables 不脱敏，会把它写进 CI 日志。
            3) 就在【本仓库】里 —— 不要加到 GitCode 那个公开仓，那是另一个仓库。
            4) 想让 tag 推送也用某个 Environment，必须把 RELEASE_ENVIRONMENT 放在
               【Repository 作用域】：要先读它才能决定用哪个 Environment，
               它自己不可能放在 Environment 里（先有鸡还是先有蛋）。
               不想折腾 Environment 也行，四项都放 Repository 作用域，同样是支持的。
          CONFIG_HELP
            exit 1
          fi
          echo "配置检查通过：仓库 ${GITCODE_OWNER}/${GITCODE_REPO}"
          echo "（Environment 作用域：${GITCODE_ENV_NAME}；变量与密钥均支持 Environment 与 Repository 两级）"

      - name: 由 tag 推导版本号
        env:
          REQ_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: bash tool/derive_version.sh "$REQ_TAG" --github-env >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      # 三个产物在这里统一命名，与 GitHub Release 上的名字一致
      - name: 组织产物
        run: |
          set -euo pipefail
          mkdir -p dist
          cp artifacts/android-apks/*.apk dist/
          # Windows：artifact 下载下来就是 Release/ 目录本身
          EXE=$(find artifacts -name 'contact_flutter.exe' | head -1)
          [ -n "$EXE" ] || { echo "::error::未找到 Windows 可执行文件"; exit 1; }
          WIN_DIR=$(dirname "$EXE")
          ( cd "$WIN_DIR" && zip -qr "${GITHUB_WORKSPACE}/dist/contact_flutter_windows_x64_${TAG}.zip" . )
          # 三个都必须存在，少一个就会把用户引到空页面
          for f in \
            "contact_flutter_${TAG}.apk" \
            "contact_flutter_${TAG}_x86_64.apk" \
            "contact_flutter_windows_x64_${TAG}.zip"
          do
            [ -s "dist/$f" ] || { echo "::error::产物缺失：dist/$f"; exit 1; }
          done
          # 附件名含 '+' 会让匿名下载 404
          if ls dist/ | grep -q '+'; then
            echo "::error::产物名含 '+'，会导致下载 404"
            ls dist/
            exit 1
          fi
          ls -lh dist/

      - name: 生成更新说明（CHANGELOG 没有对应段落时使用）
        run: |
          set -euo pipefail
          GITHUB_REF_NAME="$TAG" bash tool/gen_release_notes.sh > /tmp/auto_notes.md || true
          echo "自动生成的说明（前 10 行）："
          head -10 /tmp/auto_notes.md || true

      # 由脚本产出 Release 正文（含 Version/Version-Code 头两行，App 据此核对版本号），
      # 并顺带复核两个 APK 的包内版本号；此步不调用任何写接口。
      - name: 生成 Release 正文
        run: |
          set -euo pipefail
          python3 tool/release_gitcode.py \
            --version "$APP_VER" \
            --apk "dist/contact_flutter_${TAG}.apk" \
            --apk "dist/contact_flutter_${TAG}_x86_64.apk" \
            --notes-file /tmp/auto_notes.md \
            --emit-body /tmp/release_body.md

      # 建 Release 与上传附件交给现成的 action：
      # 它自己会 URL 编码文件名并对上传做重试，省得我们再维护这段。
      # body 是字符串参数，所以先把正文文件读进环境变量（支持多行）。
      - name: 读取 Release 正文
        run: |
          set -euo pipefail
          {
            echo 'RELEASE_BODY<<__NOTES_EOF__'
            cat /tmp/release_body.md
            echo '__NOTES_EOF__'
          } >> "$GITHUB_ENV"

      # 公开仓只放版本历史与 Release 附件，【源码一律不传】。
      #
      # ⚠️ `git push <tag>` 会把该提交可达的【全部对象】传过去，等于把整个源码
      #    与提交历史公开。所以这里不推我们的提交，而是造一个【空树、无父提交】
      #    的孤立提交，只把它当 tag 推过去——tag 只是 Release 的锚点，
      #    App 端只读 tag 名与附件，不关心它指向什么内容。
      #
      #    作者与时间都写死，使同一个 tag 每次算出同一个 SHA：重跑是
      #    "Everything up-to-date"，而不是每次都造一个新提交去强推。
      - name: 在公开仓建一个空 tag（只作 Release 锚点，不含任何源码）
        run: |
          set -euo pipefail
          git remote add gitcode \
            "https://oauth2:${GITCODE_TOKEN}@gitcode.com/${GITCODE_OWNER}/${GITCODE_REPO}.git"
          EMPTY_TREE="$(git hash-object -w -t tree /dev/null)"
          SHA="$(GIT_AUTHOR_DATE='2000-01-01T00:00:00Z' \
                 GIT_COMMITTER_DATE='2000-01-01T00:00:00Z' \
                 git -c user.name='release' -c user.email='release@local' \
                 commit-tree "$EMPTY_TREE" -m "release ${TAG}")"
          echo "空提交 $SHA（树 $EMPTY_TREE）"
          # 推之前先自证是空树：万一哪天改错了，这一步会拦住源码外泄
          if [ -n "$(git ls-tree "$SHA")" ]; then
            echo "::error::待推送的提交不是空树，存在源码外泄风险，已中止"
            git ls-tree "$SHA"
            exit 1
          fi
          git push gitcode "${SHA}:refs/tags/${TAG}"
          git ls-remote --tags gitcode "refs/tags/${TAG}"

      # files 是「按行分隔的路径或 glob」，用通配符省得在输入里拼版本号
      - name: 发布到 GitCode（建 Release + 上传 APK 与 Windows 包）
        uses: Zxilly/upload-gitcode-release@v1.0.0
        with:
          gitcode-token: ${{ secrets.GITCODE_TOKEN }}
          target-repo: ${{ env.GITCODE_OWNER }}/${{ env.GITCODE_REPO }}
          tag: ${{ env.TAG }}
          name: ${{ env.TAG }}
          body: ${{ env.RELEASE_BODY }}
          target-commitish: main
          files: |
            dist/*.apk
            dist/*.zip
          fail-if-no-files: 'true'

      - name: 复核匿名可读且可下载（App 走的就是这条路径）
        run: python3 tool/verify_gitcode_release.py

      - name: 汇总
        if: always()
        run: |
          set -euo pipefail
          {
            echo "### 发布结果"
            echo ""
            echo "- tag：${TAG:-（未推导）}"
            echo "- versionName：${APP_VER:-}"
            echo "- versionCode：${APP_CODE:-}"
            echo "- 产物："
            echo "  - contact_flutter_${TAG}.apk（arm + arm64，Android 默认包）"
            echo "  - contact_flutter_${TAG}_x86_64.apk（模拟器）"
            echo "  - contact_flutter_windows_x64_${TAG}.zip（Windows 免安装包）"
            echo "- 公开仓：https://gitcode.com/${GITCODE_OWNER}/${GITCODE_REPO}/releases"
          } >> "$GITHUB_STEP_SUMMARY"
