# 客户端自动构建：push 到 main 或手动触发时，
# 并行编译 Android APK 与 Windows x64，并上传为 Action 产物。
#
# 打 tag（如 v1.0.0）时在同一次运行里继续做两件发布：
#   1) release         → GitHub Release（私有仓，仅自己可见）
#   2) publish-gitcode → GitCode 公开仓（App 的检查更新与下载走这里）
# 两个发布用的是【同一批编好的产物】：GitCode 那边直接从 GitHub Release 取，
# 不再重新编译一遍，省掉一份完全重复的 Android/Windows 构建开销。
#
# ⚠️ 不在仓库里写死的两项，都通过 Actions Secret 注入
#    （Settings → Secrets and variables → Actions → Secrets → New repository secret）：
#      API_BASE_URL          后端地址，如 https://你的服务器（Android 与 Windows 都要）
#      SIGNING_BUNDLE_BASE64 发布签名打包文件（Android 用）：本地 bash tool/pack_signing.sh 生成
#    未配置时构建会直接失败并提示。
#
# 应用包名（安装身份）：com.newtonmiku.contact_flutter + 可选后缀
#   - 不配置后缀 → com.newtonmiku.contact_flutter（默认线）
#   - 配置后缀   → 例如 com.newtonmiku.contact_flutter_demo
#   配置位置：Settings → Secrets and variables → Actions → Variables → 新建 APP_ID_SUFFIX
#     值填 _demo（注意带下划线）。不同分支要出不同后缀时，可给分支各自的
#     变量/Environment，或用下方手动触发的 app_id_suffix 输入临时覆盖。
#
# 产物从 Actions 运行页下载（artifact 由 GitHub 打包，下载即一层 zip）：
#   - contact_flutter_apk_arm       contact_flutter.apk        armeabi-v7a + arm64-v8a，默认分发用这个
#   - contact_flutter_apk_x86_64    contact_flutter_x86_64.apk 仅 x86_64，模拟器用
#   - contact_flutter_windows_x64   Windows x64 目录内容，解压即用
#
# 打 tag（如 v1.0.0）并 push 时，会额外创建 GitHub Release：
#   - contact_flutter_v1.0.0.apk / contact_flutter_v1.0.0_x86_64.apk（下载即装，零解压）
#   - contact_flutter_windows_x64_v1.0.0.zip（单层 zip，解压即用）
name: 客户端构建与发布 (Android + Windows)

on:
  push:
    branches: [main]
    tags: ['v*']          # 打 tag（如 v1.0.0）时会额外发布 Release
  workflow_dispatch:
    inputs:
      app_id_suffix:
        description: '应用包名后缀（默认取仓库变量 APP_ID_SUFFIX；留空 = 无后缀）'
        required: false
        default: ''

concurrency:
  group: client-build-${{ github.ref }}
  cancel-in-progress: true

# 供 Gradle 读取（build.gradle.kts 里 System.getenv("APP_ID_SUFFIX")）：
# 手动触发优先用输入值，否则取仓库变量；都没有 = 无后缀（默认线）。
env:
  APP_ID_SUFFIX: ${{ inputs.app_id_suffix || vars.APP_ID_SUFFIX || '' }}

jobs:
  # 门禁：先跑静态检查与测试，红了就不往下编译。
  check:
    name: 静态检查与测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # 钉 Flutter 版本：subosito 的缓存键里带版本号，钉住后 SDK 缓存不会因为 stable 通道
      # 前进而失效（否则会整包重下 SDK + 引擎产物）。升级 Flutter 时改这里，并保持与本机一致。
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  build-android:
    name: Android APK
    needs: check
    runs-on: ubuntu-latest
    # 环境名跟着分支走：dev 分支用 dev 的 Environment，main 用 main 的。
    #
    # ⚠️ tag 推送时 github.ref_name 是【tag 名】而不是分支名，直接用它去找
    #    "v1.0.0" 这个 Environment 时 Actions 会自动建一个【空的】，
    #    于是环境级配置全部读不到，而工作流仍然是绿的——很难发现。
    #    所以 tag 回退到默认分支名。
    #
    # 环境名【不存在时会被自动创建为空】，所以用到哪些分支就必须建哪些 Environment。
    environment: ${{ github.ref_type == 'tag' && github.event.repository.default_branch || github.ref_name }}
    env:
      API_BASE_URL: ${{ secrets.API_BASE_URL }}
      APP_ID_SUFFIX: ${{ inputs.app_id_suffix || vars.APP_ID_SUFFIX || '' }}
      # 发布签名：只需一个 Secret —— 密钥库与配置打包文件的 base64
      #   本地生成：bash tool/pack_signing.sh
      SIGNING_BUNDLE_BASE64: ${{ secrets.SIGNING_BUNDLE_BASE64 }}
    steps:
      - uses: actions/checkout@v7
      - name: 显示本次应用包名后缀
        run: echo "APP_ID_SUFFIX='${APP_ID_SUFFIX}' → applicationId=com.newtonmiku.contact_flutter${APP_ID_SUFFIX}"
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      # 与 check 作业同一个 Flutter 版本（缓存键含版本号，钉住才有稳定缓存）
      - uses: subosito/flutter-action@v2
        id: flutter
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      # 引擎产物单独缓存：subosito 的缓存键按 Flutter 版本且**不可变**，容易被只跑
      # analyze/test 的 check 作业先占住（那份里没有 android 引擎产物），
      # 导致本作业每次启动都要重下几百 MB（实测约 3 分钟）。这里用自己的键单独缓存。
      - name: 缓存 Flutter 引擎产物（Android）
        uses: actions/cache@v6
        with:
          path: ${{ env.FLUTTER_ROOT }}/bin/cache/artifacts/engine
          key: flutter-engine-android-${{ runner.os }}-${{ steps.flutter.outputs.version }}
      # Gradle 依赖（发行版/AGP/Kotlin/插件 AAR）冷下载约占 5 分钟，一并缓存。
      - name: 缓存 Gradle 依赖
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle.properties', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-
      - run: flutter pub get
      # 版本号只在打 tag 时注入（换算由 tool/derive_version.sh 统一完成）。
      # 不注入就回退 pubspec 的占位值——那样的包虽然能装，但"检查更新"会一直误判。
      - name: 由 tag 推导版本号
        if: startsWith(github.ref, 'refs/tags/v')
        run: bash tool/derive_version.sh "$GITHUB_REF_NAME" --github-env >> "$GITHUB_ENV"
      # NDK/CMake 只有打包原生库(.so)时才用得到；命中缓存就不必再跑 sdkmanager（省约半分钟）。
      - name: 缓存 NDK / CMake
        uses: actions/cache@v6
        with:
          path: |
            ${{ env.ANDROID_SDK_ROOT }}/ndk
            ${{ env.ANDROID_SDK_ROOT }}/cmake
          key: ndk-30.0.15729638-cmake-3.22.1-${{ runner.os }}
      - name: 接受 Android SDK 许可并安装 NDK/CMake（已缓存则跳过）
        run: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          if [[ -d "$SDK/ndk/30.0.15729638" && -d "$SDK/cmake/3.22.1" ]]; then
            echo "NDK/CMake 已命中缓存，跳过 sdkmanager"
          else
            yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
            # 打包原生库(.so)需要 NDK；AGP 的原生配置步骤需要 CMake（版本与 AGP 期望一致）
            "$SDK/cmdline-tools/latest/bin/sdkmanager" "ndk;30.0.15729638" "cmake;3.22.1" > /dev/null || true
          fi
      - name: 校验服务器地址（Secret API_BASE_URL）
        run: |
          if [[ -z "${API_BASE_URL}" ]]; then
            echo "::error::未配置 Actions Secret API_BASE_URL（Settings → Secrets and variables → Actions → New repository secret），请先配置再构建。"
            exit 1
          fi
      - name: 准备发布签名（Secret → android/release.jks + key.properties）
        run: |
          if [[ -z "${SIGNING_BUNDLE_BASE64}" ]]; then
            echo "::error::未配置 Secret SIGNING_BUNDLE_BASE64（发布签名打包文件，生成方式见 README「发布签名」），无法出正式包。"
            exit 1
          fi
          echo "$SIGNING_BUNDLE_BASE64" | base64 -d | tar -xzf - -C android
          ls -l android/release.jks android/key.properties
      # ABI 拆分：两次构建，产物先落到 dist-apk/ 再上传（第二次会覆盖第一次的 app-release.apk）。
      #   contact_flutter.apk         = armeabi-v7a + arm64-v8a（默认分发用）
      #   contact_flutter_x86_64.apk  = 仅 x86_64（模拟器用，带后缀区分）
      # 两次构建共用同一个 Gradle 守护进程与本地构建缓存，第二次主要是 x86_64 的 AOT 编译。
      # abiFilters 由 android/app/build.gradle.kts 依据 flutter 传入的 -Ptarget-platform 设置，
      # 否则插件自带的 x86_64 .so（ML Kit）会混进默认包。
      - name: Build release APK（arm + arm64，默认包）
        run: |
          set -euo pipefail
          SHA_SHORT=${GITHUB_SHA::7}
          BUILD_TIME=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          mkdir -p dist-apk
          # 打 tag 时由 tag 注入版本；否则留空，回退 pubspec（开发/预览构建）
          VER_ARGS=()
          if [ -n "${APP_VER:-}" ]; then
            VER_ARGS+=(--build-name="$APP_VER" --build-number="$APP_CODE")
            echo "按 tag 注入版本：$APP_VER+$APP_CODE"
          else
            echo "非 tag 构建：使用 pubspec 的版本号"
          fi
          flutter build apk --release --no-pub \
            "${VER_ARGS[@]}" \
            --target-platform android-arm,android-arm64 \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --dart-define=APP_VERSION="$SHA_SHORT" \
            --dart-define=BUILD_TIME="$BUILD_TIME"
          cp build/app/outputs/flutter-apk/app-release.apk dist-apk/contact_flutter.apk
      - name: Build x86_64 APK（模拟器用）
        run: |
          set -euo pipefail
          SHA_SHORT=${GITHUB_SHA::7}
          BUILD_TIME=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          VER_ARGS=()
          if [ -n "${APP_VER:-}" ]; then
            VER_ARGS+=(--build-name="$APP_VER" --build-number="$APP_CODE")
          fi
          flutter build apk --release --no-pub \
            "${VER_ARGS[@]}" \
            --target-platform android-x64 \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --dart-define=APP_VERSION="$SHA_SHORT" \
            --dart-define=BUILD_TIME="$BUILD_TIME"
          cp build/app/outputs/flutter-apk/app-release.apk dist-apk/contact_flutter_x86_64.apk
      - name: 校验签名与 ABI（确认拆分生效、不是测试签名）
        run: |
          set -euo pipefail
          BT=$(ls -d "${ANDROID_SDK_ROOT:-$ANDROID_HOME}"/build-tools/* | sort -V | tail -1)
          abis_of() { unzip -l "$1" | grep -o 'lib/[^/]*' | sed 's|lib/||' | sort -u | paste -sd, - || true; }
          ls -lh dist-apk
          for f in dist-apk/*.apk; do
            echo "== $f"
            "$BT/apksigner" verify --print-certs "$f" | head -3
            echo "   ABI: $(abis_of "$f")"
          done
          ARM=$(abis_of dist-apk/contact_flutter.apk)
          X86=$(abis_of dist-apk/contact_flutter_x86_64.apk)
          for need in arm64-v8a armeabi-v7a; do
            [[ "$ARM" == *"$need"* ]] || { echo "::error::默认包缺少 $need（当前: ${ARM:-空}）"; exit 1; }
          done
          [[ "$ARM" != *"x86_64"* ]] || { echo "::error::默认包不应含 x86_64（当前: $ARM）"; exit 1; }
          [[ "$X86" == "x86_64" ]] \
            || { echo "::error::x86_64 包只应含 x86_64（当前: ${X86:-空}）"; exit 1; }
      # 两个 APK 分开上传：只想要手机包的人不必连 x86_64 那份一起下。
      - name: 上传默认包（arm + arm64）
        uses: actions/upload-artifact@v7
        with:
          name: contact_flutter_apk
          path: dist-apk/contact_flutter.apk
          if-no-files-found: error
      - name: 上传 x86_64 包（模拟器用）
        uses: actions/upload-artifact@v7
        with:
          name: contact_flutter_apk_x86_64
          path: dist-apk/contact_flutter_x86_64.apk
          if-no-files-found: error

  build-windows:
    name: Windows x64
    needs: check
    runs-on: windows-latest
    # 同 build-android：环境名跟分支走，tag 推送回退到默认分支（理由见上面那段注释）
    environment: ${{ github.ref_type == 'tag' && github.event.repository.default_branch || github.ref_name }}
    env:
      API_BASE_URL: ${{ secrets.API_BASE_URL }}
    steps:
      - uses: actions/checkout@v7
      # 与 check 作业同一个 Flutter 版本（缓存键含版本号，钉住才有稳定缓存）
      - uses: subosito/flutter-action@v2
        id: flutter
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      # 同 Android 作业：单独缓存 Windows 引擎产物，避免每次都重下。
      - name: 缓存 Flutter 引擎产物（Windows）
        uses: actions/cache@v6
        with:
          path: ${{ env.FLUTTER_ROOT }}/bin/cache/artifacts/engine
          key: flutter-engine-windows-${{ runner.os }}-${{ steps.flutter.outputs.version }}
      - run: flutter pub get
      # 同 Android 作业：打 tag 时由 tag 注入版本号（换算脚本共用）
      - name: 由 tag 推导版本号
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: bash tool/derive_version.sh "$GITHUB_REF_NAME" --github-env >> "$GITHUB_ENV"
      - name: 校验服务器地址（Secret API_BASE_URL）
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:API_BASE_URL)) {
            Write-Error "::error::未配置 Actions Secret API_BASE_URL，请先配置再构建。"
            exit 1
          }
      - name: Build Windows release
        shell: pwsh
        run: |
          $sha = $env:GITHUB_SHA.Substring(0, 7)
          $buildTime = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')
          # 桌面端的版本号来自 exe 的 VERSIONINFO：不注入就固定是 pubspec 的占位值，
          # 用户装了新版仍会被"检查更新"提示有新版本。
          $verArgs = @()
          if ($env:APP_VER) {
            $verArgs = @("--build-name=$env:APP_VER", "--build-number=$env:APP_CODE")
            Write-Host "按 tag 注入版本：$env:APP_VER+$env:APP_CODE"
          } else {
            Write-Host "非 tag 构建：使用 pubspec 的版本号"
          }
          flutter build windows --release @verArgs `
            --dart-define="API_BASE_URL=$env:API_BASE_URL" `
            --dart-define="APP_VERSION=$sha" `
            --dart-define="BUILD_TIME=$buildTime"
      # 直接上传构建目录：artifact 下载下来本身就是一个 zip（内含 exe 与 data/）。
      # 不再自己 Compress-Archive，否则会出现「zip 里套 zip」。
      - uses: actions/upload-artifact@v7
        with:
          name: contact_flutter_windows_x64
          path: build/windows/x64/runner/Release/
          if-no-files-found: error

  # ---------- 发布 Release（仅打 tag 时触发，如 v1.0.0）----------
  # 与 artifact 不同，Release 资产**不做二次包装**，产物都是「一层」：
  #   - APK 直接是 .apk 文件（下载即可安装，零解压）
  #   - Windows 是单个 zip（Release 只能挂文件，这一层是必要的）
  release:
    name: 发布 Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-android, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write # 创建 Release 需要
    steps:
      # 完整历史：gen_release_notes.sh 要找"上一个 tag"并跨 tag 比对提交
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: 生成 Release 说明（按提交前缀分组）
        run: bash tool/gen_release_notes.sh > release_notes.md
      - uses: actions/download-artifact@v8
        with:
          path: dist # 每个 artifact 解到 dist/<artifact 名>/
      - name: 组织产物（APK 原样 + Windows 单层 zip）
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          # 不依赖 artifact 内的目录层级：直接找文件
          APK_ARM=$(find dist -name "contact_flutter.apk" | head -1)
          [ -n "$APK_ARM" ] || { echo "::error::未找到默认（arm+arm64）APK"; exit 1; }
          cp "$APK_ARM" "dist/contact_flutter_${TAG}.apk"

          APK_X86=$(find dist -name "contact_flutter_x86_64.apk" | head -1)
          [ -n "$APK_X86" ] || { echo "::error::未找到 x86_64 APK"; exit 1; }
          cp "$APK_X86" "dist/contact_flutter_${TAG}_x86_64.apk"

          EXE=$(find dist -name "contact_flutter.exe" | head -1)
          [ -n "$EXE" ] || { echo "::error::未找到 Windows 可执行文件"; exit 1; }
          WIN_DIR=$(dirname "$EXE")
          ( cd "$WIN_DIR" && zip -qr "${GITHUB_WORKSPACE}/dist/contact_flutter_windows_x64_${TAG}.zip" . )
          ls -lh dist
      - uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          body_path: release_notes.md
          files: |
            dist/contact_flutter_${{ github.ref_name }}.apk
            dist/contact_flutter_${{ github.ref_name }}_x86_64.apk
            dist/contact_flutter_windows_x64_${{ github.ref_name }}.zip

  # ---------- 发布到 GitCode 公开仓 ----------
  # 编译只做一次：这里直接取上面 release 作业已经挂到 GitHub Release 上的三个产物，
  # 不再重新编译一遍（私有仓的 Actions 分钟数按倍数扣，Windows 还 ×2；
  # 而且两边用同一份字节，不会出现"GitHub 上是一个包、GitCode 上是另一个包"）。
  #
  # 为什么并进本工作流而不是单独一个：tag 推送会同时触发两个工作流，
  # 各自编译一遍就是双份开销，所以合成一次运行。
  publish-gitcode:
    name: 发布到 GitCode
    needs: [release]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read # 读 GitHub Release 的产物
    environment: ${{ github.ref_type == 'tag' && github.event.repository.default_branch || github.ref_name }}
    env:
      GITCODE_ENV_NAME: ${{ github.ref_type == 'tag' && github.event.repository.default_branch || github.ref_name }}
      GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
      API_BASE_URL: ${{ secrets.API_BASE_URL }}
      # owner/repo 不是敏感信息，Variables 与 Secrets 两个位置都认
      # （放错页很容易犯，而 GitHub 只给空值、报错指不到真正原因）。
      # token 刻意【不】从 Variables 读：变量不脱敏，会泄漏进日志。
      GITCODE_OWNER: ${{ vars.GITCODE_OWNER || secrets.GITCODE_OWNER }}
      GITCODE_REPO: ${{ vars.GITCODE_REPO || secrets.GITCODE_REPO }}
    steps:
      # 完整历史：gen_release_notes.sh 要找上一个 tag 并跨 tag 比对提交
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 校验配置（变量与密钥）
        run: |
          set -euo pipefail
          # 把"取了哪些、是空还是不空"写进摘要：GitHub 对 vars/secrets 的解析是
          # 「Environment 优先，回退 Repository」，取不到时只给空值、不说它去哪找过，
          # 于是同一种症状可能是好几种完全不同的原因。
          mark() { [ -n "${1:-}" ] && echo "已取到" || echo "**空**"; }
          {
            echo "### 配置解析情况"
            echo ""
            echo "本次生效的 Environment：\`${GITCODE_ENV_NAME}\`"
            echo ""
            echo "| 名称 | 期望位置 | 结果 |"
            echo "| --- | --- | --- |"
            echo "| GITCODE_OWNER | Variables 或 Secrets | $(mark "${GITCODE_OWNER:-}") |"
            echo "| GITCODE_REPO | Variables 或 Secrets | $(mark "${GITCODE_REPO:-}") |"
            echo "| GITCODE_TOKEN | 仅 Secrets | $(mark "${GITCODE_TOKEN:-}") |"
          } >> "$GITHUB_STEP_SUMMARY"

          missing=""
          # 注意用 $'\n' 拼接换行（普通字符串里的 \n 只会输出字面量）
          [ -n "${GITCODE_OWNER:-}" ] || missing="${missing}"$'\n'"  - GITCODE_OWNER（公开仓所属用户名/组织）"
          [ -n "${GITCODE_REPO:-}" ]  || missing="${missing}"$'\n'"  - GITCODE_REPO（公开仓仓库名）"
          [ -n "${GITCODE_TOKEN:-}" ] || missing="${missing}"$'\n'"  - GITCODE_TOKEN（GitCode 访问令牌，需仓库读写权限）"
          if [ -n "${missing}" ]; then
            echo "::error::缺少以下配置：${missing}"
            cat <<'CONFIG_HELP'
          GitHub 的取值顺序是【Environment 作用域优先，找不到再回退 Repository 作用域】。
          本次作业声明的 Environment 就是上面摘要里那个名字，请依次确认：

            1) 这个 Environment 在本仓库（GitHub 上的私有仓）里确实存在。
               不存在时 Actions 会自动建一个【空的】，于是什么都取不到。
            2) 变量放 Variables 页、密钥放 Secrets 页，名字大小写要完全一致。
               token 只能放 Secrets：Variables 不脱敏，会把它写进 CI 日志。
            3) 就在【本仓库】里 —— 不要加到 GitCode 那个公开仓，那是另一个仓库。
            4) 不建 Environment 也行：三项都放 Repository 作用域，同样是支持的。
          CONFIG_HELP
            exit 1
          fi
          echo "配置检查通过：仓库 ${GITCODE_OWNER}/${GITCODE_REPO}"

      - name: 由 tag 推导版本号
        run: bash tool/derive_version.sh "$GITHUB_REF_NAME" --github-env >> "$GITHUB_ENV"

      # 编译产物直接复用，不再重跑 Android / Windows 构建
      - name: 从 GitHub Release 取现成产物
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p dist
          gh release download "$GITHUB_REF_NAME" --dir dist --clobber
          for f in \
            "contact_flutter_${TAG}.apk" \
            "contact_flutter_${TAG}_x86_64.apk" \
            "contact_flutter_windows_x64_${TAG}.zip"
          do
            [ -s "dist/$f" ] || { echo "::error::GitHub Release 里缺少 $f"; exit 1; }
          done
          # 附件名含 '+' 会让匿名下载 404
          if ls dist/ | grep -q '+'; then
            echo "::error::产物名含 '+'，会导致下载 404"
            ls dist/
            exit 1
          fi
          ls -lh dist/

      - name: 生成更新说明（CHANGELOG 没有对应段落时使用）
        run: |
          set -euo pipefail
          GITHUB_REF_NAME="$TAG" bash tool/gen_release_notes.sh > /tmp/auto_notes.md || true
          head -10 /tmp/auto_notes.md || true

      # 公开仓只放版本历史与 Release 附件，【源码一律不传】。
      #
      # ⚠️ `git push <tag>` 会把该提交可达的【全部对象】传过去，等于把整个源码
      #    与提交历史公开。所以这里不推我们的提交，而是造一个【空树、无父提交】
      #    的孤立提交，只把它当 tag 推过去——tag 只是 Release 的锚点，
      #    App 端只读 tag 名与附件，不关心它指向什么内容。
      #
      #    作者与时间都写死，使同一个 tag 每次算出同一个 SHA：重跑是
      #    "Everything up-to-date"，而不是每次都造一个新提交去强推。
      - name: 在公开仓建一个空 tag（只作 Release 锚点，不含任何源码）
        run: |
          set -euo pipefail
          git remote add gitcode \
            "https://oauth2:${GITCODE_TOKEN}@gitcode.com/${GITCODE_OWNER}/${GITCODE_REPO}.git"
          EMPTY_TREE="$(git hash-object -w -t tree /dev/null)"
          SHA="$(GIT_AUTHOR_DATE='2000-01-01T00:00:00Z' \
                 GIT_COMMITTER_DATE='2000-01-01T00:00:00Z' \
                 git -c user.name='release' -c user.email='release@local' \
                 commit-tree "$EMPTY_TREE" -m "release ${TAG}")"
          echo "空提交 $SHA（树 $EMPTY_TREE）"
          # 推之前先自证是空树：万一哪天改错了，这一步会拦住源码外泄
          if [ -n "$(git ls-tree "$SHA")" ]; then
            echo "::error::待推送的提交不是空树，存在源码外泄风险，已中止"
            git ls-tree "$SHA"
            exit 1
          fi
          git push gitcode "${SHA}:refs/tags/${TAG}"
          git ls-remote --tags gitcode "refs/tags/${TAG}"

      # 建/更新 Release、上传附件、同步公开仓 README —— 全部交给自己的脚本。
      #
      # 为什么不用第三方 action：读过它的源码，它只有
      #     GET  /releases/{tag}/upload_url   （取签名地址）
      #     POST /releases                    （不存在时创建）
      # 没有 PATCH，也就是【从不更新已有 Release 的正文】。于是重发同一个 tag 时，
      # 页面上永远挂着第一次写进去的旧说明，怎么重跑都改不掉。
      # 我们的脚本能 create-or-update，还有重试、会校验 x-obs-* 头、报错也更明确。
      #
      # 顺序不能反：Release 必须挂在已存在的 tag 上，所以放在建空 tag 之后。
      - name: 发布到 GitCode（建/更新 Release + 上传 APK 与 Windows 包）
        run: |
          set -euo pipefail
          python3 tool/release_gitcode.py \
            --version "$APP_VER" \
            --apk "dist/contact_flutter_${TAG}.apk" \
            --apk "dist/contact_flutter_${TAG}_x86_64.apk" \
            --asset "dist/contact_flutter_windows_x64_${TAG}.zip" \
            --notes-file /tmp/auto_notes.md

      - name: 复核匿名可读且可下载（App 走的就是这条路径）
        run: python3 tool/verify_gitcode_release.py

      - name: 汇总
        if: always()
        run: |
          set -euo pipefail
          {
            echo "### GitCode 发布结果"
            echo ""
            echo "- tag：${TAG:-（未推导）}"
            echo "- versionName：${APP_VER:-}"
            echo "- versionCode：${APP_CODE:-}"
            echo "- 产物（直接复用 GitHub Release 的同一份字节）："
            echo "  - contact_flutter_${TAG}.apk（arm + arm64）"
            echo "  - contact_flutter_${TAG}_x86_64.apk（模拟器）"
            echo "  - contact_flutter_windows_x64_${TAG}.zip（Windows 免安装包）"
            echo "- 公开仓：https://gitcode.com/${GITCODE_OWNER}/${GITCODE_REPO}/releases"
          } >> "$GITHUB_STEP_SUMMARY"
