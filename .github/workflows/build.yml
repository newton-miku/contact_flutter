# 客户端自动构建：push 到 main 或手动触发时，
# 并行编译 Android APK 与 Windows x64，并上传为 Action 产物。
#
# ⚠️ 不在仓库里写死的两项，都通过 Actions Secret 注入
#    （Settings → Secrets and variables → Actions → Secrets → New repository secret）：
#      API_BASE_URL          后端地址，如 https://你的服务器（Android 与 Windows 都要）
#      SIGNING_BUNDLE_BASE64 发布签名打包文件（Android 用）：本地 bash tool/pack_signing.sh 生成
#    未配置时构建会直接失败并提示。
#
# 应用包名（安装身份）：com.newtonmiku.contact_flutter + 可选后缀
#   - 不配置后缀 → com.newtonmiku.contact_flutter（默认线）
#   - 配置后缀   → 例如 com.newtonmiku.contact_flutter_demo（自定义后缀）
#   配置位置：Settings → Secrets and variables → Actions → Variables → 新建 APP_ID_SUFFIX
#     值填 _demo（注意带下划线）。不同分支要出不同发布线时，可给分支各自的
#     变量/Environment，或用下方手动触发的 app_id_suffix 输入临时覆盖。
#
# 产物从 Actions 运行页下载（artifact 由 GitHub 打包，下载即一层 zip）：
#   - contact_flutter_apk（内含 app-release.apk，发布密钥签名，可覆盖安装）
#   - contact_flutter_windows_x64（Windows x64 目录内容，解压即用）
#
# 打 tag（如 v1.0.0）并 push 时，会额外创建 GitHub Release：
#   - contact_flutter_v1.0.0.apk（下载即装，零解压）
#   - contact_flutter_windows_x64_v1.0.0.zip（单层 zip，解压即用）
name: 客户端构建 (Android + Windows)

on:
  push:
    branches: [main]
    tags: ['v*']          # 打 tag（如 v1.0.0）时会额外发布 Release
  workflow_dispatch:
    inputs:
      app_id_suffix:
        description: '应用包名后缀（默认取仓库变量 APP_ID_SUFFIX；留空 = 无后缀）'
        required: false
        default: ''

concurrency:
  group: client-build-${{ github.ref }}
  cancel-in-progress: true

# 供 Gradle 读取（build.gradle.kts 里 System.getenv("APP_ID_SUFFIX")）：
# 手动触发优先用输入值，否则取仓库变量；都没有 = 无后缀（默认线）。
env:
  APP_ID_SUFFIX: ${{ inputs.app_id_suffix || vars.APP_ID_SUFFIX || '' }}

jobs:
  # 门禁：先跑静态检查与测试，红了就不往下编译。
  check:
    name: 静态检查与测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  build-android:
    name: Android APK
    needs: check
    runs-on: ubuntu-latest
    env:
      API_BASE_URL: ${{ secrets.API_BASE_URL }}
      APP_ID_SUFFIX: ${{ inputs.app_id_suffix || vars.APP_ID_SUFFIX || '' }}
      # 发布签名：只需一个 Secret —— 密钥库与配置打包文件的 base64
      #   本地生成：bash tool/pack_signing.sh
      SIGNING_BUNDLE_BASE64: ${{ secrets.SIGNING_BUNDLE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - name: 显示本次应用包名后缀
        run: echo "APP_ID_SUFFIX='${APP_ID_SUFFIX}' → applicationId=com.newtonmiku.contact_flutter${APP_ID_SUFFIX}"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        id: flutter
        with:
          channel: stable
          cache: true
      # 引擎产物单独缓存：subosito 的缓存键按 Flutter 版本且**不可变**，容易被只跑
      # analyze/test 的 check 作业先占住（那份里没有 android 引擎产物），
      # 导致本作业每次启动都要重下几百 MB（实测约 3 分钟）。这里用自己的键单独缓存。
      - name: 缓存 Flutter 引擎产物（Android）
        uses: actions/cache@v4
        with:
          path: ${{ env.FLUTTER_ROOT }}/bin/cache/artifacts/engine
          key: flutter-engine-android-${{ runner.os }}-${{ steps.flutter.outputs.version }}
      # Gradle 依赖（发行版/AGP/Kotlin/插件 AAR）冷下载约占 5 分钟，一并缓存。
      - name: 缓存 Gradle 依赖
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-
      - run: flutter pub get
      - name: 缓存 NDK（打包原生库需要；首次运行会下载，之后命中缓存）
        uses: actions/cache@v4
        with:
          path: ${{ env.ANDROID_SDK_ROOT }}/ndk
          key: ndk-30.0.15729638-${{ runner.os }}
      - name: 接受 Android SDK 许可并安装 NDK/CMake
        run: |
          SM="${ANDROID_SDK_ROOT:-$ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SM" --licenses > /dev/null || true
          # 打包原生库(.so)需要 NDK；AGP 的原生配置步骤需要 CMake（版本与 AGP 期望一致）
          "$SM" "ndk;30.0.15729638" "cmake;3.22.1" > /dev/null || true
      - name: 校验服务器地址（Secret API_BASE_URL）
        run: |
          if [[ -z "${API_BASE_URL}" ]]; then
            echo "::error::未配置 Actions Secret API_BASE_URL（Settings → Secrets and variables → Actions → New repository secret），请先配置再构建。"
            exit 1
          fi
      - name: 准备发布签名（Secret → android/release.jks + key.properties）
        run: |
          if [[ -z "${SIGNING_BUNDLE_BASE64}" ]]; then
            echo "::error::未配置 Secret SIGNING_BUNDLE_BASE64（发布签名打包文件，生成方式见 README「发布签名」），无法出正式包。"
            exit 1
          fi
          echo "$SIGNING_BUNDLE_BASE64" | base64 -d | tar -xzf - -C android
          ls -l android/release.jks android/key.properties
      - name: Build release APK
        run: |
          SHA_SHORT=${GITHUB_SHA::7}
          BUILD_TIME=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          flutter build apk --release \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --dart-define=APP_VERSION="$SHA_SHORT" \
            --dart-define=BUILD_TIME="$BUILD_TIME"
      - name: 校验签名证书（确认不是测试签名）
        run: |
          BT=$(ls -d "${ANDROID_SDK_ROOT:-$ANDROID_HOME}"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs build/app/outputs/flutter-apk/app-release.apk | head -6
      - uses: actions/upload-artifact@v4
        with:
          name: contact_flutter_apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  build-windows:
    name: Windows x64
    needs: check
    runs-on: windows-latest
    env:
      API_BASE_URL: ${{ secrets.API_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        id: flutter
        with:
          channel: stable
          cache: true
      # 同 Android 作业：单独缓存 Windows 引擎产物，避免每次都重下。
      - name: 缓存 Flutter 引擎产物（Windows）
        uses: actions/cache@v4
        with:
          path: ${{ env.FLUTTER_ROOT }}/bin/cache/artifacts/engine
          key: flutter-engine-windows-${{ runner.os }}-${{ steps.flutter.outputs.version }}
      - run: flutter pub get
      - name: 校验服务器地址（Secret API_BASE_URL）
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:API_BASE_URL)) {
            Write-Error "::error::未配置 Actions Secret API_BASE_URL，请先配置再构建。"
            exit 1
          }
      - name: Build Windows release
        shell: pwsh
        run: |
          $sha = $env:GITHUB_SHA.Substring(0, 7)
          $buildTime = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')
          flutter build windows --release `
            --dart-define="API_BASE_URL=$env:API_BASE_URL" `
            --dart-define="APP_VERSION=$sha" `
            --dart-define="BUILD_TIME=$buildTime"
      # 直接上传构建目录：artifact 下载下来本身就是一个 zip（内含 exe 与 data/）。
      # 不再自己 Compress-Archive，否则会出现「zip 里套 zip」。
      - uses: actions/upload-artifact@v4
        with:
          name: contact_flutter_windows_x64
          path: build/windows/x64/runner/Release/
          if-no-files-found: error

  # ---------- 发布 Release（仅打 tag 时触发，如 v1.0.0）----------
  # 与 artifact 不同，Release 资产**不做二次包装**，产物都是「一层」：
  #   - APK 直接是 .apk 文件（下载即可安装，零解压）
  #   - Windows 是单个 zip（Release 只能挂文件，这一层是必要的）
  release:
    name: 发布 Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-android, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write # 创建 Release 需要
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist # 每个 artifact 解到 dist/<artifact 名>/
      - name: 组织产物（APK 原样 + Windows 单层 zip）
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          # 不依赖 artifact 内的目录层级：直接找文件
          APK=$(find dist -name "app-release.apk" | head -1)
          [ -n "$APK" ] || { echo "::error::未找到 APK"; exit 1; }
          cp "$APK" "dist/contact_flutter_${TAG}.apk"

          EXE=$(find dist -name "contact_flutter.exe" | head -1)
          [ -n "$EXE" ] || { echo "::error::未找到 Windows 可执行文件"; exit 1; }
          WIN_DIR=$(dirname "$EXE")
          ( cd "$WIN_DIR" && zip -qr "${GITHUB_WORKSPACE}/dist/contact_flutter_windows_x64_${TAG}.zip" . )
          ls -lh dist
      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/contact_flutter_${{ github.ref_name }}.apk
            dist/contact_flutter_windows_x64_${{ github.ref_name }}.zip
