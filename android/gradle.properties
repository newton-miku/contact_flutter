# Gradle 构建参数（本地与 CI 共用）。
# 目标：让「第二次及以后」的构建尽量命中缓存，别每次都从零编译打包。
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -Dfile.encoding=UTF-8
# 多模块并行（Flutter 工程会把各插件当子项目，串行编译很浪费）
org.gradle.parallel=true
# 本地构建缓存：加速「换个 ABI 再打一次包」（arm 包与 x86_64 包共用 dex/R8 产物）
org.gradle.caching=true

android.useAndroidX=true
android.newDsl=false
android.builtInKotlin=false
android.experimental.disableCmakeVersionCheck=true
